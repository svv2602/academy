name: Deploy to GitHub Pages
# The same checks as ci.yml (ARCH-15), then the very build that was checked is published - and only if "check" passed.
# Before a publication everything is played, whatever changed (ARCH-16): every walkthrough and the probe world. There
# is no job "plan" here on purpose: the list of jobs is fixed, do not take it from tools/ci-pieces.mjs.
# Keep the steps of the jobs build, walk and worlds the same as in ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    name: unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Keep the build for the walkthroughs and the publication
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  walk:
    name: walkthrough ${{ matrix.size }} ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        size: [mobile, desktop, desktop-tall, mobile-portrait]
        # The pieces of the world (tools/e2e-saves.mjs): each starts from its own save, together they are the whole
        # walkthrough of a size; the four of one size are what --combine expects of it.
        group: [world1, world2, finale, shop, tasks2, collect]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The build of this run
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # tools/shot.mjs starts Chrome from this exact path; fail here with a clear reason if the runner has none.
      - name: Check Chrome
        run: /usr/bin/google-chrome --version
      # The runner has no GPU: software rendering and the lowest fixed graphics tier.
      - name: Walkthrough
        shell: bash
        env:
          E2E_GL: swiftshader
          Q: '0'
          # One piece of the world takes 2-15 minutes here; the limit is tools/ci-pieces.mjs TRY_LIMITS.piece (the numbers
          # are there).
          E2E_RUN_TIMEOUT_MS: '1350000'
          # The probe world is played by the job "worlds", not by the step of the same name in the phone's shop.
          E2E_WORLDS: '0'
        run: |
          set -o pipefail
          npm run e2e -- --skip-build --mode ${{ matrix.size }} --only ${{ matrix.group }} 2>&1 | tee e2e.log
      - name: Results for "check"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # the number of the attempt: a job played again leaves its results again, and "check" takes the last ones
          name: results-${{ matrix.size }}-${{ matrix.group }}-a${{ github.run_attempt }}
          path: |
            shots-e2e/summary-${{ matrix.size }}-${{ matrix.group }}.json
            shots-e2e/models-requested-${{ matrix.size }}-${{ matrix.group }}.json
            shots-e2e/voice-${{ matrix.size }}-${{ matrix.group }}.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload screenshots and log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ matrix.size }}-${{ matrix.group }}-a${{ github.run_attempt }}
          path: |
            shots-e2e/
            e2e.log
          if-no-files-found: ignore
          retention-days: 7

  # The probe world (TECH-15, TECH-09): the build to publish must hold nothing of it; the build that lists it is made
  # here (dist-probe/) and the world is played in it. Played before every publication, every part of tools/worlds.mjs.
  worlds:
    name: worlds (probe world, ${{ matrix.part }})
    needs: build
    runs-on: ubuntu-latest
    # a walkthrough of a whole world has a limit of 20 minutes (tools/forest-pass.mjs, tools/sea-pass.mjs PASS_TIMEOUT_MS),
    # the setup before it (npm ci, the build of the run) some 4
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [walk, cache, transition, travel, hub, hub-forest, forest, sea, sweet, sky]   # the parts of tools/worlds.mjs, a job each - PUBLISH_PARTS: not the grey build's (the grey worlds are not published; ci.yml plays them); hub-forest: the way to the published worlds from the hub; forest, sea, sweet, sky: the published worlds' walkthroughs by their descriptions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The build of this run
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Check Chrome
        run: /usr/bin/google-chrome --version
      # The runner has no GPU: software rendering and the lowest fixed graphics tier, as in the walkthroughs.
      - name: Probe world
        shell: bash
        env:
          E2E_GL: swiftshader
          Q: '0'
        run: |
          set -o pipefail
          node tools/worlds.mjs dist --only ${{ matrix.part }} 2>&1 | tee worlds.log
      - name: Upload screenshots and log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-failure-${{ matrix.part }}-a${{ github.run_attempt }}
          path: |
            shots-e2e/
            worlds.log
          if-no-files-found: ignore
          retention-days: 7

  # The whole walkthrough of the phone's size in one session (ARCH-15): what piles up over a session - the queue of the
  # scenes of the achievements, the counters, the order of the scenes - is seen by no piece, each of which starts from a
  # save of its own. Its limits are those of a trial of the whole walkthrough (tools/ci-pieces.mjs TRY_LIMITS.all).
  session:
    name: walkthrough mobile, the whole session
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The build of this run
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Check Chrome
        run: /usr/bin/google-chrome --version
      - name: Walkthrough
        shell: bash
        env:
          E2E_GL: swiftshader
          Q: '0'
          E2E_RUN_TIMEOUT_MS: '3600000'
          E2E_WORLDS: '0'
        run: |
          set -o pipefail
          npm run e2e -- --skip-build --mode mobile 2>&1 | tee e2e.log
      - name: Upload screenshots and log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-failure-a${{ github.run_attempt }}
          path: |
            shots-e2e/
            e2e.log
          if-no-files-found: ignore
          retention-days: 7

  check:
    needs: [build, walk, worlds, session]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job passed
        shell: bash
        run: |
          echo "unit tests and build: ${{ needs.build.result }}; walkthroughs: ${{ needs.walk.result }}; probe world: ${{ needs.worlds.result }}; the whole session: ${{ needs.session.result }}"
          test "${{ needs.build.result }}" = success && test "${{ needs.walk.result }}" = success && test "${{ needs.worlds.result }}" = success && test "${{ needs.session.result }}" = success
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 22
      - name: Results of the walkthroughs
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: results-*
          path: e2e-results-all     # a folder an artifact: results-<size>-<group>-a<attempt>
      # The results of the last attempt of every walkthrough, chosen by the number in the name (as in ci.yml).
      - name: The last attempt of every walkthrough
        if: ${{ !cancelled() }}
        run: node tools/ci-pieces.mjs results e2e-results-all e2e-results
      - name: Checks over all sizes
        if: ${{ !cancelled() }}
        run: node tools/e2e.mjs --combine e2e-results --only world1,world2,finale,shop,tasks2,collect

  deploy:
    needs: check            # published only after a green "check": the build checked above, not a new one
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}
    steps:
      - name: The build that was checked
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The site packed as actions/upload-pages-artifact@v3 packs it (artifact.tar), but in an artifact named after the
      # attempt, as every artifact here but the build: a rerun of this job ("Re-run failed jobs") publishes its own,
      # never meets the one of the attempt before ("Multiple artifacts named github-pages").
      - name: Pack the site
        shell: sh
        run: tar --dereference --hard-dereference --directory dist -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: The site for GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      # GitHub may not list an artifact just uploaded yet ("No artifacts named github-pages"): one more try after a pause.
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-a${{ github.run_attempt }}
      - name: A pause before the second try
        if: ${{ steps.first.outcome == 'failure' }}
        run: sleep 60
      - id: second
        if: ${{ steps.first.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-a${{ github.run_attempt }}
