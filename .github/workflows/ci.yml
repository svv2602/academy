name: CI
# Checks every branch except main (main is checked by pages.yml before it publishes: there everything is played, always).
# Unit tests, type check and build run once; the built game is then played in the four screen sizes, each in four
# pieces of the world (--only, tools/e2e-saves.mjs), sixteen jobs at the same time, on that very build; the probe
# world is played by jobs of its own ("worlds": one for each part of tools/worlds.mjs). The job "check" passes only
# if all of them passed and the checks that need every size at once (the models requested, the walkthrough without
# the voice) pass over their results (ARCH-15).
# On a branch, what is played depends on the files that changed against dev (ARCH-16; the job "plan",
# tools/ci-pieces.mjs): files of one world - the jobs of that world, a shared file - everything, documents alone - unit
# tests and build only; whenever the changed files cannot be told, and in a run started by hand - everything.
# A push to dev does not play its commit a second time: when this very commit has a completed, successful run by a
# push on its branch - one that played everything, or one that played less by its plan on top of a head of dev that is
# green itself - the push to dev rests on that run and plays nothing again; "check" names the run and the basis. In
# every other case (no such run, a red or cancelled one, GitHub did not answer) a push to dev plays everything. So a
# green "check" on a commit of dev still means that all of it was played green on this tree - here, or in the run named.
# Trial branches (try/**) are not checked here: .github/workflows/try.yml plays them, and it is not the gate.
# "check" compares the result of every job with the plan and prints what was skipped and why.
# "check" is the status the protection of main requires: do not rename that job.
on:
  push:
    branches-ignore: [main, 'try/**']
  pull_request:
  # Proof that "check" really fails: a run started by hand can break the walkthrough of one size on purpose.
  workflow_dispatch:
    inputs:
      break:
        description: 'Break the walkthrough of one size on purpose (none: a normal run)'
        type: choice
        options: [none, mobile, desktop, desktop-tall, mobile-portrait]
        default: none
permissions:
  contents: read
  actions: read       # the job "plan" of a push to dev asks which runs this commit already has (tools/ci-pieces.mjs `rests`)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # What this run plays. All the logic is in tools/ci-pieces.mjs (unit tests: tools/ci-pieces.test.mjs); a failure
  # here fails "check".
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      walk: ${{ steps.pick.outputs.walk }}         # 'true': the walkthroughs of "matrix" are played
      worlds: ${{ steps.pick.outputs.worlds }}     # 'true': the probe world is played
      matrix: ${{ steps.pick.outputs.matrix }}     # {"include":[{"size":…,"group":…},…]}
      jobs: ${{ steps.pick.outputs.jobs }}         # the same walkthroughs for --combine --jobs
      report: ${{ steps.pick.outputs.report }}     # the reason and the changed files, in words
    steps:
      # The whole history and every branch: the changed files of a branch are counted from its common ancestor with
      # origin/dev. A push to dev itself is not compared with anything: it asks GitHub whether this commit was already
      # played green on its branch (CI_SHA, CI_BEFORE, the token) and plays everything unless it was.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: What to play
        id: pick
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SHA: ${{ github.sha }}
          CI_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci-pieces.mjs plan

  build:
    name: unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check and build
        run: npm run build
      # Left under a bare name on purpose, unlike the results below: a build made again (the whole run played again)
      # is a build of this same commit, so whichever of the two a later job downloads is the build of this commit -
      # and every walkthrough compares the commit in the build with its checkout.
      - name: Keep the build for the walkthroughs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  walk:
    name: walkthrough ${{ matrix.size }} ${{ matrix.group }}
    needs: [plan, build]
    # No walkthrough planned: the job is skipped (an empty matrix would be an error), and "check" expects exactly that.
    if: ${{ needs.plan.outputs.walk == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false        # every size reports, not only the first that failed
      # A size and a piece of the world per job (tools/world-pieces.mjs, tools/e2e-saves.mjs): each piece starts from
      # its own save, the four of one size are the whole walkthrough of it - what --combine expects.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The build of this run
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # tools/shot.mjs starts Chrome from this exact path; fail here with a clear reason if the runner has none.
      - name: Check Chrome
        run: /usr/bin/google-chrome --version
      # The runner has no GPU: software rendering and the lowest fixed graphics tier. A whole size took 13-21 minutes
      # (2026-11-16); a piece of it takes 5-9.
      # The size decides the rest itself (tools/e2e.mjs): desktop is played offline, desktop-tall without the voice.
      - name: Walkthrough
        shell: bash
        env:
          E2E_GL: swiftshader
          Q: '0'
          # One piece of the world takes 2-15 minutes here; the limit is tools/ci-pieces.mjs TRY_LIMITS.piece (the numbers
          # are there).
          E2E_RUN_TIMEOUT_MS: '1350000'
          # The probe world is played by the job "worlds", not by the step of the same name in the phone's shop.
          E2E_WORLDS: '0'
          # workflow_dispatch "break": every quest of this size counts as stuck at once, so its walkthrough fails.
          E2E_STUCK_MS: ${{ inputs.break == matrix.size && '1' || '' }}
        run: |
          set -o pipefail
          npm run e2e -- --skip-build --mode ${{ matrix.size }} --only ${{ matrix.group }} 2>&1 | tee e2e.log
      # What "check" reads; uploaded also when the walkthrough failed, so that "check" can name it.
      - name: Results for "check"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # the number of the attempt: a job played again leaves its results again, and "check" takes the last ones
          name: results-${{ matrix.size }}-${{ matrix.group }}-a${{ github.run_attempt }}
          path: |
            shots-e2e/summary-${{ matrix.size }}-${{ matrix.group }}.json
            shots-e2e/models-requested-${{ matrix.size }}-${{ matrix.group }}.json
            shots-e2e/voice-${{ matrix.size }}-${{ matrix.group }}.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload screenshots and log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ matrix.size }}-${{ matrix.group }}-a${{ github.run_attempt }}
          path: |
            shots-e2e/
            e2e.log
          if-no-files-found: ignore
          retention-days: 7

  # The probe world (TECH-15, TECH-09): the build of this run must hold nothing of it; the build that lists it is made
  # here (dist-probe/, so the sources and the packages are needed) and the world is played in it. Each part of
  # tools/worlds.mjs is a job: a new scenario there is a new part here, not more minutes in an old job.
  worlds:
    name: worlds (probe world, ${{ matrix.part }})
    needs: [plan, build]
    if: ${{ needs.plan.outputs.worlds == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: [walk, cache, transition, travel, hub, hub-grey]   # the parts of tools/worlds.mjs, a job each (hub-grey: the grey build's way to the forest)
    steps:
      # The same checkout as in "build": tools/worlds.mjs compares the commit in the build with the one of the sources.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The build of this run
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Check Chrome
        run: /usr/bin/google-chrome --version
      # The runner has no GPU: software rendering and the lowest fixed graphics tier, as in the walkthroughs.
      - name: Probe world
        shell: bash
        env:
          E2E_GL: swiftshader
          Q: '0'
        run: |
          set -o pipefail
          node tools/worlds.mjs dist --only ${{ matrix.part }} 2>&1 | tee worlds.log
      - name: Upload screenshots and log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-failure-${{ matrix.part }}-a${{ github.run_attempt }}
          path: |
            shots-e2e/
            worlds.log
          if-no-files-found: ignore
          retention-days: 7

  check:
    needs: [plan, build, walk, worlds]
    # Runs when they failed too: a job skipped because of a failure would count as passed for the protection of main.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A planned job must have succeeded, a job that was not planned must have been skipped; a failed plan fails it.
      # Prints what the plan skipped and why, with the changed files.
      - name: Every job ended as planned
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WALK_RESULT: ${{ needs.walk.result }}
          WORLDS_RESULT: ${{ needs.worlds.result }}
          PLAN_WALK: ${{ needs.plan.outputs.walk }}
          PLAN_WORLDS: ${{ needs.plan.outputs.worlds }}
          PLAN_REPORT: ${{ needs.plan.outputs.report }}
        run: node tools/ci-pieces.mjs check
      - name: Results of the walkthroughs
        if: ${{ !cancelled() && needs.plan.outputs.walk == 'true' }}
        uses: actions/download-artifact@v4
        continue-on-error: true   # none at all when the build failed: the next step says what is missing
        with:
          pattern: results-*
          path: e2e-results-all     # a folder an artifact: results-<size>-<group>-a<attempt>
      # A walkthrough played again left its results again: the ones of its last attempt are taken (tools/ci-pieces.mjs
      # `lastAttempts`), by the number in the name - not by whichever artifact a merged download would write last.
      - name: The last attempt of every walkthrough
        if: ${{ !cancelled() && needs.plan.outputs.walk == 'true' }}
        run: node tools/ci-pieces.mjs results e2e-results-all e2e-results
      # All four sizes passed on this commit, one was played without the voice, the models requested add up.
      # Not run when no walkthrough was planned: it needs every size played whole (the step above says so).
      - name: Checks over all sizes
        if: ${{ !cancelled() && needs.plan.outputs.walk == 'true' }}
        env:
          PLAN_JOBS: ${{ needs.plan.outputs.jobs }}
        run: node tools/e2e.mjs --combine e2e-results --jobs "$PLAN_JOBS"
