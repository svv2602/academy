name: CI
# Checks every branch except main: unit tests, type check and build, then the full walkthrough of the built game.
# main is checked by pages.yml, which runs the same steps before it publishes.
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check and build
        run: npm run build
      # tools/shot.mjs starts Chrome from this exact path; fail here with a clear reason if the runner has none.
      - name: Check Chrome
        run: /usr/bin/google-chrome --version
      # The runner has no GPU: software rendering and the lowest fixed graphics tier.
      # Measured locally on 4 cores: the two main sizes take about 10 minutes, all four about twice as long.
      - name: Walkthrough (four screen sizes)
        timeout-minutes: 45
        shell: bash
        env:
          E2E_GL: swiftshader
          Q: '0'
        run: |
          set -o pipefail
          npm run e2e -- --skip-build --all-sizes 2>&1 | tee e2e.log
      - name: Upload screenshots and log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            shots-e2e/
            e2e.log
          if-no-files-found: ignore
          retention-days: 7
