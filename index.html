<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fd0ff">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Академія чарівних світів</title>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div class="pill"><span>⭐</span><b id="stars">0</b></div>
    <div class="pill"><span>💎</span><b id="crystals">0</b></div>
    <button id="btnBook" class="pill" aria-label="collection">📖</button>
  </div>
  <div id="fps"></div>

  <div id="answers" class="hidden"></div>
  <button id="answersClose" class="hidden" aria-label="close">✕</button>

  <div id="joy"><div id="knob"></div></div>
  <button id="btnJump" class="round hidden" aria-label="jump">⬆</button>
  <button id="btnAct" class="round hidden"></button>

  <div id="task" class="hidden">
    <div class="t-card">
      <button id="taskClose" aria-label="close">✕</button>
      <div id="taskStage" class="t-stage"></div>
      <div id="taskOpts" class="t-opts"></div>
    </div>
  </div>
  <!-- After the task panel, so that it lies over it: a tap on the bubble says its line again. -->
  <div id="bubble" class="hidden" role="button"><div class="cat" id="speaker">🐱</div><p id="bubbleText"></p></div>

  <!-- The cut-scenes (WORLD-13, src/game/story.ts): over everything; a tap goes on, the button skips the whole scene. -->
  <div id="story" class="hidden"><p id="storySub" class="hidden"></p><button id="storySkip" aria-label="skip">⏭</button></div>

  <!-- The book of treasures, the profile (PLAY-07, PLAY-09; src/ui/book.ts): like the shop, the heroine close up on the
       free side and the card with tabs by pictures - the magic shelf (five places, the lands open), the secrets, the
       pets, the achievements. Nothing scrolls. -->
  <div id="book" class="hidden">
    <div id="bookSay" class="quiet"><div class="cat">🐱</div><p id="bookSayText"></p></div>
    <div class="card book-card">
      <div class="book-head"><h2 id="colTitle"></h2><div id="colStats" class="stats"></div></div>
      <div class="book-row"><div id="bookTabs" class="shop-tabs"></div><div id="bookStories" class="story-row"></div></div>
      <div id="bookShelf" class="book-pane"><div id="shelf" class="shelf"></div><p id="shelfSay" class="book-line"></p><div id="shards" class="shards"></div></div>
      <div id="bookSecrets" class="book-pane hidden"><p id="secretsSay" class="book-line"></p><div id="secrets" class="tiles"></div></div>
      <div id="bookCollect" class="book-pane hidden"><div id="collect" class="crows"></div><p id="collectSay" class="book-line"></p></div>
      <div id="bookPicture" class="book-pane hidden"><div id="picture" class="pic-frame"></div><p id="pictureSay" class="book-line"></p></div>
      <div id="bookPets" class="book-pane hidden"><div id="pets" class="tiles"></div><p id="petsSay" class="book-line"></p></div>
      <div id="bookAch" class="book-pane hidden"><div id="achs" class="ach-grid"></div><p id="achSay" class="book-line"></p></div>
      <div class="sheet-btns"><div class="sheet-row"><button id="btnShop" class="big small"></button><button id="bookClose" class="big small"></button><button id="btnParents" class="link"></button></div></div>
    </div>
  </div>
  <!-- The shop and the fitting room (PLAY-04, PLAY-05): the heroine stays in view on the free side of the screen. -->
  <div id="shop" class="hidden">
    <div id="shopSay"><div class="cat">🐱</div><p id="shopSayText"></p></div>
    <div class="shop-card">
      <div id="shopTabs" class="shop-tabs"></div>
      <div id="shopItems" class="shop-items scroll-area"></div>
      <div id="shopAct" class="shop-act"></div>
      <button id="shopDone" class="big small"></button>
    </div>
  </div>
  <div id="parents" class="hidden">
    <div class="card sheet">
      <h2 id="pTitle"></h2>
      <div id="gate"><p id="gateQ"></p><input id="gateA" inputmode="numeric" maxlength="3" autocomplete="off"></div>
      <div id="pBody" class="hidden"></div>
      <div class="sheet-btns"><button id="parentsClose" class="big small"></button></div>
    </div>
  </div>

  <div id="fanfare" class="hidden">
    <div class="card">
      <div class="rays"></div>
      <div class="gem">💎</div>
      <h2 id="fanfareTitle"></h2>
      <p id="fanfareText"></p>
      <button id="fanfareOk" class="big"></button>
    </div>
  </div>

  <!-- The cat's offer of a break (PLAY-20, src/ui/session.ts): at a stop point, after a task or a part; one tap of either
       button ends it, the game is never closed. -->
  <div id="breakCard" class="hidden">
    <div class="card break-card">
      <div class="break-cat" aria-hidden="true">🐱</div>
      <p id="breakSay"></p>
      <div class="break-btns"><button id="breakYes" class="big"></button><button id="breakNo" class="big"></button></div>
    </div>
  </div>

  <div id="start">
    <div class="panel">
      <h1 id="title"></h1>
      <h3 id="subtitle"></h3>
      <div id="loading"><div id="bar"></div><span id="loadingText"></span></div>
      <!-- In place of the loading bar: this device cannot run the game (TECH-07) or the game did not load (TECH-08). -->
      <div id="notice" class="hidden" role="alert"><p id="noticeText"></p><button id="retry" class="big hidden"></button></div>
      <div id="setup" class="hidden">
        <div class="row"><span id="lblName"></span><input id="name" maxlength="20" autocomplete="off" autocapitalize="words"></div>
        <!-- The four ready looks (PLAY-06): built by src/ui/shop.ts (initLooks). -->
        <div class="row"><span id="lblLooks"></span><div id="looks"></div></div>
        <div class="row"><span id="lblDress"></span><div id="dress" class="swatches"></div></div>
        <div class="row"><span id="lblHair"></span><div id="hair" class="swatches"></div></div>
        <button id="play" class="big"></button>
        <button id="restart" class="link hidden"></button>
      </div>
      <!-- "Till tomorrow" (R36): the cat asleep in place of the setup, one tap of "Continue" back into the game. -->
      <div id="sleep" class="hidden"><div class="sleep-cat" aria-hidden="true">🐱<span>💤</span></div><p id="sleepSay"></p><button id="wake" class="big"></button></div>
      <div id="langs"><button data-lang="uk">UA</button><button data-lang="ru">RU</button></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
