<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fd0ff">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Академія чарівних світів</title>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div class="pill"><span>⭐</span><b id="stars">0</b></div>
    <div class="pill"><span>💎</span><b id="crystals">0/5</b></div>
    <button id="btnBook" class="pill" aria-label="collection">📖</button>
  </div>
  <div id="fps"></div>

  <div id="bubble" class="hidden"><div class="cat" id="speaker">🐱</div><p id="bubbleText"></p></div>
  <div id="answers" class="hidden"></div>

  <div id="joy"><div id="knob"></div></div>
  <button id="btnJump" class="round hidden" aria-label="jump">⬆</button>
  <button id="btnAct" class="round hidden"></button>

  <div id="task" class="hidden">
    <div class="t-card">
      <button id="taskClose" aria-label="close">✕</button>
      <div id="taskStage" class="t-stage"></div>
      <div id="taskOpts" class="t-opts"></div>
    </div>
  </div>

  <div id="book" class="hidden">
    <div class="card sheet">
      <h2 id="colTitle"></h2>
      <div id="shards" class="shards"></div>
      <div id="colStats" class="stats"></div>
      <div class="sheet-btns"><button id="bookClose" class="big small"></button><button id="btnParents" class="link"></button></div>
    </div>
  </div>
  <div id="parents" class="hidden">
    <div class="card sheet">
      <h2 id="pTitle"></h2>
      <div id="gate"><p id="gateQ"></p><input id="gateA" inputmode="numeric" maxlength="3" autocomplete="off"></div>
      <div id="pBody" class="hidden"></div>
      <div class="sheet-btns"><button id="parentsClose" class="big small"></button></div>
    </div>
  </div>

  <div id="fanfare" class="hidden">
    <div class="card">
      <div class="rays"></div>
      <div class="gem">💎</div>
      <h2 id="fanfareTitle"></h2>
      <p id="fanfareText"></p>
      <button id="fanfareOk" class="big"></button>
    </div>
  </div>

  <div id="start">
    <div class="panel">
      <h1 id="title"></h1>
      <h3 id="subtitle"></h3>
      <div id="loading"><div id="bar"></div><span id="loadingText"></span></div>
      <div id="setup" class="hidden">
        <div class="row"><span id="lblName"></span><input id="name" maxlength="20" autocomplete="off" autocapitalize="words"></div>
        <div class="row"><span id="lblDress"></span><div id="dress" class="swatches"></div></div>
        <div class="row"><span id="lblHair"></span><div id="hair" class="swatches"></div></div>
        <div class="row"><span id="lblStyle"></span><div id="style" class="styles"></div></div>
        <button id="play" class="big"></button>
        <button id="restart" class="link hidden"></button>
      </div>
      <div id="langs"><button data-lang="uk">UA</button><button data-lang="ru">RU</button></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
